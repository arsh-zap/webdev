<body>
    
  
  <!-- 1. Text Field -->
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="e.g. jdoe123" required>
  </div>

  <!-- 2. Email Field -->
  <div>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
  </div>

  <!-- 3. Password Field -->
  <div>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" minlength="8" required>
  </div>

  <!-- 4. Radio Buttons (Select only one option) -->
  <div>
    <p>Account Type:</p>
    <input type="radio" id="personal" name="account_type" value="personal">
    <label for="personal">Personal</label>
    
    <input type="radio" id="business" name="account_type" value="business">
    <label for="business">Business</label>
  </div>

  <!-- 5. Checkboxes (Select multiple options) -->
  <div>
    <p>Interests:</p>
    <input type="checkbox" id="coding" name="interests" value="coding">
    <label for="coding">Coding</label>
    
    <input type="checkbox" id="design" name="interests" value="design">
    <label for="design">Design</label>
  </div>

  <!-- 6. Dropdown Selection Menu -->
  <div>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="uk">United Kingdom</option>
    </select>
  </div>

  <!-- 7. Textarea (Multi-line text input) -->
  <div>
    <label for="bio">Biography:</label><br>
    <textarea id="bio" name="bio" rows="4" cols="50"></textarea>
  </div>

  <!-- 8. Submit Button -->
  <div>
    <button type="submit">Submit Registration</button>
  </div>

  <div>
    <input type="color" id="favcolor" name="favcolor" value="#ff0000">
    <label for="color"></label>
  </div>

  <select name="" id="">
    <option value="Choose File">
        <input type="file" id="file" name="file" value="file">
    </option>
  </select>

  <label for="file">choose a File</label>

</form>

</body>
</html>
